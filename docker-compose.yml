# Local PostgreSQL matching backend/.env DATABASE_URL (port 5433, db accessai).
# Requires Docker Desktop (or daemon) running: docker compose up -d

services:
  db:
    image: postgres:16-alpine
    container_name: accessai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: accessai
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d accessai"]
      interval: 5s
      timeout: 5s
      retries: 5
